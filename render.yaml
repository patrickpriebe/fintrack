# =============================================================================
# Render Blueprint: FinTrack API Infrastructure as Code
#
# Apply: In Render Dashboard, select New > Blueprint and point to this repository.
#
# Sensitive variables use `sync: false` so they are prompted securely in the
# Render dashboard and never stored in git.
# =============================================================================

services:
  - type: web
    name: fintrack-api
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./backend/Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: APP_NAME
        value: FinTrack
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_KEY
        sync: false
      - key: APP_URL
        value: https://fintrack-api-08b9.onrender.com
      - key: FRONTEND_URLS
        value: https://fintrack-ui-tan.vercel.app
      - key: DB_CONNECTION
        value: pgsql
      - key: DB_HOST
        value: aws-1-us-west-2.pooler.supabase.com
      - key: DB_PORT
        value: "5432"
      - key: DB_DATABASE
        value: postgres
      - key: DB_USERNAME
        value: postgres.yunysypofpoegvquffag
      - key: DB_PASSWORD
        sync: false
      - key: DB_SCHEMA
        value: fintrack
      - key: DB_SSLMODE
        value: require
      - key: LOG_CHANNEL
        value: stderr
      - key: LOG_LEVEL
        value: warning
      - key: CACHE_STORE
        value: file
      - key: QUEUE_CONNECTION
        value: sync
      - key: SESSION_DRIVER
        value: array
      - key: RUN_MIGRATIONS
        value: "true"
